question:"No EGARCH, γ = −0.083 (M6, p < 0.001). Uma boa notícia (+2% no PSI-20, z_t = +1.5) e uma má notícia (−2%, z_t = −1.5) têm o mesmo módulo. Qual tem maior impacto na volatilidade seguinte?",
options:["Boa notícia — γ negativo amplifica retornos positivos","Má notícia — com γ < 0, choques negativos geram mais volatilidade do que positivos de igual magnitude","São iguais — o EGARCH trata z e |z| igualmente","Depende do sinal de α"],
answer:1,expl:"Com γ = −0.083 < 0: choque positivo tem efeito ∝ (α + γ) = α − 0.083; choque negativo tem efeito ∝ (α − γ) = α + 0.083. Como −0.083 < 0, o efeito negativo é maior. Má notícia: efeito = α + |γ| > α − |γ| = efeito da boa notícia."},

{id:"p5_ex",type:"exam",title:"Exame — EGARCH e Leverage Effect",questions:[
{q:"O leverage effect (γ < 0 no EGARCH) significa que:",opts:["A volatilidade é negativa em alguns períodos","Más notícias (retornos negativos) geram mais volatilidade do que boas notícias de igual magnitude","Boas notícias geram mais volatilidade","Os choques são simétricos"],a:1},
{q:"Vantagem do EGARCH sobre o GARCH(1,1) simétrico:",opts:["Tem menos parâmetros","Capta assimetria (leverage effect) sem restrições de não-negatividade dos parâmetros","Tem convergência mais rápida","Tem sempre menor AIC"],a:1},
{q:"α + β < 1 no GARCH; β < 1 no EGARCH garantem:",opts:["Que os parâmetros são positivos","Estacionariedade covariância — a volatilidade não explode para infinito","Que o leverage effect existe","Que o OLS seria adequado"],a:1}
]}
]}, /* end s5 */

/* ── S6: VARIÁVEIS POLÍTICAS ──────────────────────── */
{id:"s6",title:"Variáveis Políticas e het()",pages:[

{id:"p6_1",type:"content",title:"Como incluir eventos políticos num modelo GARCH",sub:"Dois canais: a média dos retornos e a variância",blocks:[
{t:"txt",c:"Incluir variáveis políticas num modelo GARCH requer decisões metodológicas cuidadosas. Há dois canais pelos quais a política pode afetar os mercados: o nível dos retornos (canal da média) e a incerteza (canal da variância)."},
{t:"h3",c:"Canal da média — efeito nos retornos médios"},
{t:"txt",c:"Incluir variáveis políticas na equação da média testa se eventos políticos afetam o nível esperado dos retornos. Um coeficiente significativo indicaria que o mercado, em média, vai melhor ou pior durante esse período."},
{t:"formula",lbl:"Equação da média com variáveis políticas",c:"r_t = α + β₁·r_ES50,t + β₂·D_político,t + ε_t\n\nβ₂ = efeito da variável política nos retornos médios\n\nH₀: β₂ = 0  (sem efeito médio)"},
{t:"key",title:"Resultado na tua tese — canal da média",c:"Quase nenhuma variável política é significativa na equação da média. A única excepção é shock_economic = −0.273*** — os choques económicos (resgate de 2011, BES 2014) afetam negativamente os retornos médios. As variáveis eleitorais não são significativas. Este resultado é consistente com a eficiência semi-forte."},
{t:"h3",c:"Canal da variância — efeito na volatilidade"},
{t:"txt",c:"Mais interessante: as variáveis políticas podem afetar a <em>incerteza</em> (volatilidade) sem afetar os retornos médios. Um governo de esquerda pode não fazer o mercado subir ou descer em média, mas pode torná-lo mais ou menos volátil."},
{t:"formula",lbl:"Especificação het() — variáveis na variância incondicional",c:"σ²_t = σ̄² × exp(δ × D_político,t) × [dinâmica GARCH]\n\nonde σ̄² = variância incondicional de referência\n      exp(δ) = fator multiplicativo da variância quando D = 1\n\nSe δ = −0.077 e D_político = 1:\n  σ²_t = σ̄² × exp(−0.077) × [dinâmica]\n        = σ̄² × 0.926 × [dinâmica]\n        → variância 7.4% mais baixa durante este período"},
{t:"h3",c:"Porquê especificação multiplicativa e não aditiva"},
{t:"txt",c:"A especificação multiplicativa <code>exp(δ·D)</code> tem duas vantagens: (1) a variância permanece sempre positiva independentemente do valor de δ; (2) δ é interpretado como um efeito proporcional (percentual), o que é mais natural do que um efeito em unidades absolutas."},
{t:"example",title:"Interpretação het(left_gov) = −0.077",c:"δ = −0.077, D = 1 durante governos de esquerda\n\nEfeito multiplicativo: exp(−0.077) ≈ 0.926\n\nIsso significa:\n  σ²_t (governo esquerda) = 0.926 × σ²_t (governo direita) × [dinâmica]\n\nA variância condicional é 7.4% mais baixa sob governos de esquerda\ndo que sob governos de direita (estado de referência),\nmantendo constante a dinâmica GARCH e o risco europeu.\n\nNota: exp(−0.077) − 1 ≈ −7.4%, não −7.7%. O texto da tese usa −7.7%\n(interpretação aproximada de δ × 100). Para pequenos δ, as duas\naproximações são similares."},
{t:"beyond",title:"Het() em outras aplicações",c:"Macroeconomia: testar se recessões aumentam a volatilidade do crescimento do PIB. Energia: testar se invernos frios aumentam a volatilidade dos preços da eletricidade. Agronomia: testar se anos de seca aumentam a volatilidade dos preços agrícolas. Em todos estes casos, o het() testa se uma condição binária (recessão = 1, inverno frio = 1) afeta a volatilidade de uma série."}
]},

{id:"p6_2",type:"content",title:"Construção das variáveis e janelas de eventos",sub:"Decisões metodológicas com impacto nos resultados",blocks:[
{t:"txt",c:"A forma como construímos as variáveis dummy políticas tem impacto direto nos resultados. Há duas decisões principais: a largura das janelas de eventos e a exclusividade mútua das dummies."},
{t:"h3",c:"Janelas de ±30 dias — a lógica"},
{t:"txt",c:"A janela de ±30 dias antes e depois de cada evento foi escolhida para captar três fases distintas:"},
{t:"steps",steps:[
{n:1,c:"<strong>Período de antecipação (−30 a −1 dias)</strong>: os mercados começam a incorporar a incerteza associada ao evento iminente. A volatilidade pode aumentar antes da eleição, à medida que os investidores se protegem."},
{n:2,c:"<strong>Dia do evento (0)</strong>: o próprio evento — eleição, formação de governo, anúncio de choque."},
{n:3,c:"<strong>Período pós-evento (+1 a +30 dias)</strong>: resolução da incerteza e ajustamento às novas condições políticas. A volatilidade pode diminuir após as eleições."}
]},
{t:"table",cols:["Escolha de janela","Vantagens","Desvantagens"],rows:[
["±15 dias","Mais limpa — menos 'ruído' de outros eventos","Pode perder efeitos de antecipação mais distantes"],
["±30 dias","Equilíbrio razoável — capta antecipação e resolução","Pode incluir eventos não relacionados"],
["±60 dias","Captura efeitos mais prolongados","Mais overlap entre eventos; multicolinearidade"]
]},
{t:"h3",c:"Dummies mutuamente exclusivas — porquê é importante"},
{t:"txt",c:"A tua tese constrói <code>regular_only</code> e <code>snap_only</code> como mutuamente exclusivas. Um dia pode cair na janela de uma eleição regular, ou de uma eleição antecipada, mas não de ambas. Isto resolve o problema de multicolinearidade."},
{t:"warn",title:"O que é multicolinearidade e porque é um problema",c:"Multicolinearidade ocorre quando duas variáveis explicativas são altamente correlacionadas entre si. As estimativas dos coeficientes ficam muito imprecisas (erros-padrão enormes) e é difícil saber qual variável está a 'fazer o trabalho'. Com dummies não-mutuamente-exclusivas, um mesmo dia poderia ser codificado como 1 em ambas — criando correlação perfeita. As dummies mutuamente exclusivas eliminam este problema."},
{t:"key",title:"Poder estatístico — a limitação fundamental",c:"Com ±30 dias × 9 eleições ≈ 540 dias de 'tratamento' em 7.116 total (≈ 7.6%), o poder estatístico para detetar efeitos pequenos é limitado. Se o efeito real for de 0.1 p.p. de redução de volatilidade, pode não ser detetável com esta proporção de observações tratadas. Isto explica — pelo menos parcialmente — a ausência de efeitos significativos nas variáveis eleitorais individuais."}
]},

{id:"p6_q1",type:"question",title:"het() — interpretação",
question:"het(left_gov) = −0.077 (p < 0.001) na equação da variância. A interpretação correta é:",
options:["Os retornos médios são 7.7% mais baixos sob governos de esquerda","A variância condicional é aproximadamente 7.4% mais baixa (menor volatilidade) sob governos de esquerda vs. direita, com tudo o resto constante","O leverage effect é mais forte sob governos de esquerda","Os resultados do GARCH são inválidos sob governos de esquerda"],
answer:1,expl:"Na especificação het(), δ = −0.077 actua sobre a variância incondicional de forma multiplicativa: a variância é exp(−0.077) ≈ 0.926 vezes a variância de referência, ou seja, ~7.4% mais baixa. Note que é um efeito sobre a VARIÂNCIA (volatilidade), não sobre os retornos médios."},

{id:"p6_ex",type:"exam",title:"Exame — Variáveis Políticas",questions:[
{q:"Porquê construir regular_only e snap_only como mutuamente exclusivas?",opts:["Para aumentar o poder estatístico","Para evitar multicolinearidade — dois dummies correlacionados produzem coeficientes imprecisos","Para reduzir o número de observações tratadas","Para garantir α + β < 1 no GARCH"],a:1},
{q:"A ausência de efeitos significativos das variáveis eleitorais na equação da média é consistente com:",opts:["A forma fraca da EMH — preços passados não preveem","A eficiência semi-forte — eventos públicos antecipados já estão nos preços","O leverage effect — más notícias geram mais volatilidade","A não-estacionariedade dos preços"],a:1},
{q:"Het() é metodologicamente preferível a incluir variáveis políticas apenas na equação da média porque:",opts:["É computacionalmente mais simples","Permite distinguir efeitos na média (nível dos retornos) de efeitos na volatilidade (incerteza) — dimensões independentes","Elimina a necessidade de testar ARCH-LM","Aumenta o número de observações"],a:1}
]}
]}, /* end s6 */

/* ── S7: EFICIÊNCIA DE MERCADO ────────────────────── */
{id:"s7",title:"Eficiência de Mercado",pages:[

{id:"p7_1",type:"content",title:"A Hipótese dos Mercados Eficientes — em profundidade",sub:"Eugene Fama, 1970: o enquadramento teórico central",blocks:[
{t:"txt",c:"A Hipótese dos Mercados Eficientes (EMH) é um dos pilares da teoria financeira moderna e o enquadramento teórico central da tua tese. Compreendê-la em profundidade — incluindo as suas nuances e limitações — é essencial para a defesa."},
{t:"h3",c:"A ideia central"},
{t:"txt",c:"Fama (1970) propôs que os preços dos ativos financeiros refletem toda a informação relevante disponível. Numa versão extrema, não seria possível 'vencer o mercado' de forma consistente — qualquer informação disponível já estaria incorporada no preço."},
{t:"analogy",title:"Analogia: as notas no chão",c:"Um professor de finanças e o seu aluno caminham pelo campus quando o aluno vê uma nota de 20€ no chão. 'Posso apanhá-la?', pergunta. O professor responde: 'Não pode ser real — se fosse, alguém já a teria apanhado.' Esta é a lógica da EMH: em mercados eficientes, as oportunidades de lucro são exploradas tão rapidamente que desaparecem quase instantaneamente."},
{t:"h3",c:"As três formas de eficiência"},
{t:"table",cols:["Forma","Informação incorporada","O que não funciona","Testável com"],rows:[
["Fraca","Toda a história de preços e retornos","Análise técnica (padrões de preços)","Autocorrelação, regras de filtro"],
["Semi-forte","Toda a informação PÚBLICA (anúncios, políticas, macro)","Análise fundamentalista","Event studies — tua tese!"],
["Forte","TODA a informação, incluindo insider","Qualquer estratégia","Difícil — testada indiretamente"]
]},
{t:"h3",c:"Event studies — como se testa a eficiência semi-forte"},
{t:"txt",c:"Um event study analisa o comportamento dos retornos em torno de um evento para verificar se há <strong>retornos anormais</strong> — retornos acima ou abaixo do esperado dado o risco do ativo. Se os mercados forem semi-fortemente eficientes, não deverá haver retornos anormais sistematicamente previsíveis em torno de eventos públicos."},
{t:"formula",lbl:"Retorno anormal num event study",c:"AR_t = r_PSI20,t − E[r_PSI20,t | informação]\n\nonde E[r_PSI20,t] pode ser estimado como:\n  α + β₁ × r_ES50,t  (modelo de mercado)\n\nSe os mercados forem eficientes:\n  E[AR_t] = 0  para todos os t em torno do evento"},
{t:"h3",c:"A nuance crucial — retornos vs. volatilidade"},
{t:"txt",c:"Este é o ponto mais importante para a tua tese: a EMH diz que os <em>retornos médios</em> não são previsíveis com informação pública. Não diz nada sobre a <em>volatilidade</em>."},
{t:"key",title:"Eficiência de retornos ≠ eficiência de volatilidade",c:"É perfeitamente possível que:\n  • Os retornos médios sejam eficientes (não previsíveis)\n  • A volatilidade tenha padrões previsíveis associados ao ciclo político\n\nA tua tese encontra exactamente isto:\n  • Variáveis eleitorais na média → não significativas (eficiência semi-forte)\n  • het(left_gov) na variância → significativo (**)\n\nEstes dois resultados são complementares, não contraditórios."},
{t:"beyond",title:"A EMH em contextos não-financeiros",c:"Mercado de apostas desportivas: odds de futebol tendem a refletir bem as probabilidades reais — é difícil ganhar consistentemente. Mercado imobiliário: mais ineficiente (menos transparência, custos de transação altos) — há mais evidência de previsibilidade de preços. Mercado de trabalho: salários refletem competências (produtividade)? Há evidências de ineficiências (discriminação, assimetrias de informação)."}
]},

{id:"p7_2",type:"content",title:"Ciclos políticos e mercados — a literatura",sub:"Nordhaus, Hibbs, Alesina, Pástor & Veronesi",blocks:[
{t:"txt",c:"A ligação entre ciclos políticos e mercados financeiros tem uma literatura vasta. Os modelos teóricos evoluíram de simples modelos oportunistas para modelos sofisticados com expectativas racionais."},
{t:"h3",c:"Os modelos clássicos"},
{t:"table",cols:["Autor","Modelo","Mecanismo","Relevância para a tua tese"],rows:[
["Nordhaus (1975)","Ciclo político-económico oportunista","Governantes manipulam a economia antes das eleições para maximizar votos","Prevê efeitos eleitorais — não encontrados nos retornos"],
["Hibbs (1977)","Teoria partidária","Esquerda prefere desemprego baixo; direita prefere inflação baixa","Base para testar left_gov"],
["Alesina (1987)","Teoria partidária racional","Apenas a SURPRESA eleitoral gera efeitos reais — resultado esperado já está nos preços","Explica ausência de efeitos sistemáticos em janelas de ±30 dias"]
]},
{t:"h3",c:"Pástor & Veronesi (2020) — a resolução moderna do 'Presidential Puzzle'"},
{t:"txt",c:"Santa-Clara & Valkanov (2003) documentaram que ações americanas têm retornos mais altos sob governos democratas do que republicanos. Pástor & Veronesi (2020) propuseram a explicação racional: não são as políticas democráticas que causam melhores retornos — é que os democratas tendem a ser eleitos em momentos de alta aversão ao risco, que coincide com maior prémio de risco."},
{t:"analogy",title:"Analogia: a confundição e o guarda-chuva",c:"Há uma forte correlação entre vender guarda-chuvas e chover. Mas os guarda-chuvas não causam a chuva — a chuva causa a compra de guarda-chuvas. Da mesma forma: governos de esquerda não causam melhores retornos — as condições de alta aversão ao risco (que geram maiores retornos esperados) causam tanto os bons retornos como a eleição de governos de esquerda."},
{t:"key",title:"Ligação ao teu resultado het(left_gov)",c:"O efeito de menor volatilidade sob governos de esquerda (δ = −0.077**) pode refletir um efeito de composição temporal:\n  • Governos PS em Portugal: 1995–2002 (crescimento), 2015–2023 (recuperação)\n  • Governos PSD/CDS: 2002–2005, 2011–2015 (ambos períodos de crise)\n\nO modelo controla para o risco europeu via EuroStoxx 50, mas não elimina completamente a confundição com o ciclo económico português. Isto é uma limitação honesta que deve ser reconhecida na defesa."}
]},

{id:"p7_q1",type:"question",title:"EMH — forma semi-forte",
question:"Os retornos do PSI-20 em torno de eleições não são significativamente diferentes de zero (variáveis eleitorais na equação da média, p > 0.10). O que podes concluir?",
options:["Os mercados portugueses são completamente ineficientes","Este resultado é consistente com a eficiência semi-forte — eleições são eventos públicos antecipados; a incerteza é incorporada gradualmente, não em janelas discretas de ±30 dias","Os mercados são eficientes na forma forte","O modelo GARCH está mal especificado"],
answer:1,expl:"Eficiência semi-forte implica que eventos públicos antecipados (como eleições com data conhecida) já são incorporados nos preços muito antes de acontecerem. A ausência de retornos anormais em ±30 dias é consistente com esta hipótese. Atenção: não prova a eficiência semi-forte — apenas não a rejeita."},

{id:"p7_ex",type:"exam",title:"Exame — Eficiência de Mercado",questions:[
{q:"Eficiência semi-forte da EMH implica que os preços refletem:",opts:["Apenas preços históricos","Toda a informação pública disponível (anúncios, políticas, macro)","Toda a informação incluindo insider","Apenas a história recente de preços"],a:1},
{q:"Segundo Alesina (1987), o que gera efeitos de mercado em torno de eleições?",opts:["O resultado eleitoral em si","A surpresa eleitoral — resultado diferente do esperado gera efeitos reais transitórios","As políticas implementadas nos primeiros 100 dias","A volatilidade pré-eleitoral"],a:1},
{q:"A tua tese encontra: (1) variáveis eleitorais não significativas na equação da média; (2) het(left_gov) significativo na variância. Estes dois resultados são:",opts:["Contraditórios — um refuta o outro","Complementares — eficiência de retornos e previsibilidade de volatilidade são dimensões independentes","Impossíveis de ocorrer simultaneamente","Prova de que a EMH é falsa em Portugal"],a:1}
]}
]}, /* end s7 */

/* ── S8: DIAGNÓSTICOS AVANÇADOS ───────────────────── */
{id:"s8",title:"Diagnósticos e Robustez",pages:[

{id:"p8_1",type:"content",title:"Diagnósticos pós-estimação dos modelos GARCH",sub:"Como verificar que o modelo está bem especificado",blocks:[
{t:"txt",c:"Estimar um modelo é apenas o primeiro passo. Depois de estimar, é obrigatório verificar que o modelo captura adequadamente as características dos dados — que os resíduos se comportam como deveriam se o modelo fosse correto."},
{t:"h3",c:"Resíduos padronizados — z_t = ε_t / σ_t"},
{t:"txt",c:"Se o GARCH estiver bem especificado, os resíduos padronizados z_t = ε_t / σ_t devem ser aproximadamente i.i.d. (independentes e identicamente distribuídos) com média zero e variância 1. Específicamente, a variância condicional σ²_t deve capturar toda a heterocedasticidade, deixando z_t com variância constante."},
{t:"table",cols:["Diagnóstico","O que testa","H₀","Resultado desejado"],rows:[
["Ljung-Box em z_t","Autocorrelação nos resíduos padronizados","Sem autocorrelação","p > 0.05 — não rejeitar"],
["Ljung-Box em z²_t","Autocorrelação nos quadrados — efeitos ARCH residuais","Sem efeitos ARCH residuais","p > 0.05 — não rejeitar"],
["Média de z_t","Média dos resíduos padronizados","Média = 0","Próxima de 0"],
["Variância de z_t","Variância dos resíduos padronizados","Variância = 1","Próxima de 1"]
]},
{t:"h3",c:"Convergência dos modelos"},
{t:"txt",c:"A tua tese refere que 'todos os seis modelos convergem sem erros de otimização'. Isto é mais importante do que parece. A função de log-verossimilhança do GARCH pode ter múltiplos máximos locais ou regiões planas que dificultam a convergência. Convergência limpa indica que o algoritmo encontrou o máximo global e que os resultados são numericamente fiáveis."},
{t:"h3",c:"Robustez — o que significa e porque importa"},
{t:"txt",c:"Um resultado é <strong>robusto</strong> se se mantém quando fazemos escolhas metodológicas alternativas razoáveis. Na tua tese, a robustez manifesta-se em várias dimensões:"},
{t:"table",cols:["Resultado","Evidência de robustez"],rows:[
["γ ≈ −0.08 (leverage effect)","Confirmado em AMBOS M5 e M6 — especificações distintas com e sem variáveis eleitorais"],
["β₁ ≈ 0.557 (EuroStoxx 50)","Extremamente estável em todos os 6 modelos — indica boa especificação"],
["het(left_gov) ≈ −0.077","Encontrado no EGARCH com melhor ajustamento (AIC)"],
["Convergência limpa","Todos os 6 modelos convergem — confirma estabilidade numérica"]
]},
{t:"key",title:"Porque os erros-padrão OPG são adequados na tua tese",c:"Os erros-padrão nos modelos GARCH podem ser calculados por três métodos: Hessiano (assume especificação correta), OPG (Outer Product of Gradients), ou Sandwich (QMLE). O OPG usa os gradientes individuais de cada uma das 7.116 observações para construir uma estimativa da matrix de informação que é robusta a má-especificação da função de verossimilhança. É mais conservador que o Hessiano — erros-padrão tendem a ser maiores, inferências mais prudentes. É uma escolha metodologicamente defensável."}
]},

{id:"p8_q1",type:"question",title:"Diagnósticos — interpretação",
question:"O teste Ljung-Box aplicado aos resíduos padronizados ao quadrado z²_t tem p = 0.32 (lag 10). O que podes concluir sobre o ajustamento do modelo GARCH?",
options:["O modelo está mal especificado — deve-se rejeitar","Com p = 0.32 > 0.05, não rejeitamos H₀ (sem autocorrelação em z²_t) — o modelo capturou adequadamente os efeitos ARCH, sem heterocedasticidade condicional residual","Os resíduos têm fat tails — é necessário mudar de distribuição","O alpha do modelo GARCH é zero"],
answer:1,expl:"H₀ do Ljung-Box: sem autocorrelação nos resíduos até lag 10. Com p = 0.32 > 0.05, não rejeitamos H₀. Isto é sinal positivo: significa que o modelo GARCH capturou toda a heterocedasticidade condicional — os resíduos padronizados ao quadrado já não são autocorrelacionados."}
]}, /* end s8 */

/* ── S9: GUIA DE DEFESA ───────────────────────────── */
{id:"s9",title:"Guia de Defesa",pages:[

{id:"p9_1",type:"content",title:"Perguntas prováveis — respostas estruturadas",sub:"Como responder ao júri com clareza e rigor",blocks:[
{t:"txt",c:"A defesa de tese é uma conversa académica, não um interrogatório. O júri quer verificar que compreendes o que fizeste e consegues defender as tuas escolhas. Prepara respostas estruturadas: 'o que fiz', 'porquê', 'o que diz o resultado', 'quais as limitações'."},
{t:"h3",c:"As perguntas mais prováveis"},
{t:"callout",v:"ct",title:"P1: Porque usaste GARCH e não OLS simples?",c:"Resposta estruturada:\n1. PROBLEMA: O OLS assume Var(ε_t) = σ² constante (homocedasticidade).\n2. EVIDÊNCIA DE VIOLAÇÃO: O teste ARCH-LM dá χ²(1) = 1668.6, p = 0.000 — 434 vezes acima do valor crítico. Homocedasticidade é massivamente violada.\n3. CONSEQUÊNCIA: Com homocedasticidade violada, os erros-padrão OLS são inconsistentes → testes t e valores-p inválidos.\n4. SOLUÇÃO: Os modelos GARCH foram desenvolvidos precisamente para modelar σ²_t variável no tempo — produzem estimativas eficientes e inferências válidas."},
{t:"callout",v:"ct",title:"P2: O que significa α + β = 0.968?",c:"Resposta:\n• α + β é a persistência total dos choques de volatilidade.\n• 0.968 significa que 96.8% de um choque de volatilidade ainda está presente no dia seguinte.\n• Como α + β < 1, o processo é covariância-estacionário — a volatilidade converge para a média incondicional no longo prazo.\n• Semi-vida: ln(0.5)/ln(0.968) ≈ 21 dias — ao fim de 21 dias de bolsa, metade do choque dissipou-se."},
{t:"callout",v:"ct",title:"P3: Porque γ negativo confirma o leverage effect?",c:"Resposta:\n• No EGARCH, z_t = ε_t/σ_t é positivo se o retorno foi positivo, negativo se foi negativo.\n• Na equação: ln(σ²_t) = ... + γ·z_{t-1}\n• Se γ < 0 e z_{t-1} < 0 (má notícia), então γ·z_{t-1} > 0 → ln(σ²_t) aumenta mais.\n• Se γ < 0 e z_{t-1} > 0 (boa notícia), então γ·z_{t-1} < 0 → ln(σ²_t) aumenta menos.\n• γ = −0.08 → más notícias geram ~60% mais volatilidade que boas notícias equivalentes."},
{t:"callout",v:"ct",title:"P4: Porque não encontraste efeitos eleitorais nos retornos?",c:"Resposta (dois mecanismos complementares):\n1. EFICIÊNCIA SEMI-FORTE: As eleições têm datas conhecidas antecipadamente. Os mercados incorporam a incerteza eleitoral gradualmente ao longo de semanas/meses — não há concentração de ajustamento em janelas de ±30 dias.\n2. PODER ESTATÍSTICO: ±30 dias × 9 eleições ≈ 540 dias tratados em 7.116 total (7.6%). Para efeitos pequenos, este poder pode ser insuficiente. A ausência de significância ≠ ausência de efeito."},
{t:"callout",v:"ct",title:"P5: Porque governos de esquerda têm menor volatilidade?",c:"Resposta (duas interpretações):\n1. CANAL DE EXPECTATIVAS (Leblang & Mukherjee, 2005): governos de esquerda sinalizam políticas mais expansionistas, reduzindo a incerteza sobre taxas de juro reais e, portanto, a volatilidade das valorizações.\n2. COMPOSIÇÃO TEMPORAL: Em Portugal, governos PS coincidiram com crescimento (1995–2002, 2015–2023); PSD/CDS com crises (2002–2005, 2011–2015). O modelo controla para risco europeu via EuroStoxx 50, mas a confundição com o ciclo económico português não é eliminada completamente — esta é uma limitação reconhecida."}
]},

{id:"p9_2",type:"content",title:"Conceitos que o júri pode testar",sub:"Definições rápidas e distinções importantes",blocks:[
{t:"h3",c:"Distinções fundamentais para a defesa"},
{t:"table",cols:["Conceito A","vs.","Conceito B","A diferença"],rows:[
["Estacionariedade em sentido forte","vs.","Covariância-estacionariedade (sentido fraco)","Forte: distribuição idêntica para todo o t. Fraco: apenas média e variância constantes — mais fácil de verificar e suficiente para a maioria dos modelos"],
["Significância estatística","vs.","Significância prática","Estatística: p < α. Prática: a magnitude do efeito importa para decisões reais. Com n = 7116, até efeitos ínfimos podem ser significativos estatisticamente"],
["Estimador não-enviesado","vs.","Estimador consistente","Não-enviesado: E[β̂] = β para qualquer n. Consistente: β̂ → β quando n → ∞. Um estimador pode ser consistente sem ser não-enviesado"],
["Heterocedasticidade condicional","vs.","Heterocedasticidade incondicional","Condicional: Var(ε_t | Ω_{t-1}) varia — clustering. Incondicional: Var(ε_t) varia — escala. GARCH modela a condicional"],
["Eficiência de retornos","vs.","Eficiência de volatilidade","Retornos eficientes: não previsíveis com info pública. Volatilidade: pode ter padrões previsíveis sem violar a EMH"]
]},
{t:"h3",c:"Glossário completo"},
{t:"table",cols:["Sigla","Nome completo","Papel na tua tese"],rows:[
["ARCH","Autoregressive Conditional Heteroscedasticity","Modelo de base para variância condicional — Engle (1982)"],

/* ═══════════════════════════════════════════════════
   STATE & PERSISTENCE
═══════════════════════════════════════════════════ */
let pages=[], secMap=[];
C.sections.forEach(s=>s.pages.forEach(p=>{secMap.push(s.title);pages.push({...p})}));

let cur=0, done=new Set(), qst={}, est={};

function save(){try{localStorage.setItem('sg_cur',cur);localStorage.setItem('sg_done',JSON.stringify([...done]))}catch(e){}}
function load(){try{const c=localStorage.getItem('sg_cur');const d=localStorage.getItem('sg_done');if(c!==null)cur=parseInt(c)||0;if(d!==null)done=new Set(JSON.parse(d))}catch(e){}}

/* ═══════════════════════════════════════════════════
   MOBILE DRAWER
═══════════════════════════════════════════════════ */
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawerOverlay').classList.add('open');buildDrawerNav()}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('open')}

/* ═══════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════ */
function goto(i){if(i<0||i>=pages.length)return;cur=i;qst={};est={};save();render();window.scrollTo(0,0);closeDrawer()}

function buildNavHTML(containerClass){
  let html='',last='';
  pages.forEach((p,i)=>{
    const s=secMap[i];
    if(s!==last){html+=`<div class="nav-sec">${s}</div>`;last=s}
    const dc={'content':'dc','question':'dq','exam':'de'}[p.type];
    const on=i===cur,dn=done.has(i)&&!on;
    html+=`<button class="nav-btn${on?' on':''}${dn?' done':''} ${dc}" onclick="goto(${i})">
      <span class="ndot"></span>
      <span class="ntxt">${p.title}</span>
    </button>`;
  });
  return html;
}

function buildSideNav(){
  document.getElementById('sideNav').innerHTML=buildNavHTML('sideNav');
  const pct=Math.round(done.size/pages.length*100);
  document.getElementById('spct').textContent=pct+'%';
  document.getElementById('spbar').style.width=pct+'%';
}
function buildDrawerNav(){
  document.getElementById('drawerNav').innerHTML=buildNavHTML('drawerNav');
  const pct=Math.round(done.size/pages.length*100);
  document.getElementById('dpct').textContent=pct+'%';
  document.getElementById('dpbar').style.width=pct+'%';
}
function updateMobHeader(){
  document.getElementById('mobTitle').textContent=pages[cur].title;
  const pct=Math.round(done.size/pages.length*100);
  document.getElementById('mobPct').textContent=pct+'%';
}

/* ═══════════════════════════════════════════════════
   BLOCK RENDERING
═══════════════════════════════════════════════════ */
const VARIANTS={
  neutral:'box-neutral',key:'box-key',warn:'box-warn',
  analogy:'box-analogy',example:'box-example',
  beyond:'box-beyond',insight:'box-insight',
  ct:'box-neutral',ck:'box-key',cw:'box-warn'
};
const LABELS={
  neutral:'Nota',key:'Conceito chave',warn:'Atenção',
  analogy:'Analogia',example:'Exemplo trabalhado',
  beyond:'Para além da tese',insight:'Insight',
  ct:'Na tua tese',ck:'Conceito chave',cw:'Atenção'
};

function rblocks(bs){
  return bs.map(b=>{
    if(b.t==='txt') return`<p class="body-txt">${b.c}</p>`;
    if(b.t==='h3') return`<h3 class="block-h">${b.c}</h3>`;
    if(b.t==='h4') return`<h4 class="block-sh">${b.c}</h4>`;
    if(b.t==='formula') return`<div class="formula"><span class="formula-lbl">${b.lbl}</span>${b.c}</div>`;
    if(b.t==='table'){
      const th=b.cols?`<tr>${b.cols.map(c=>`<th>${c}</th>`).join('')}</tr>`:'';
      const td=b.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');
      return`<table class="dtable">${th}${td}</table>`;
    }
    if(b.t==='steps') return`<div class="steps">${b.steps.map(s=>`<div class="step"><div class="step-num">${s.n}</div><div class="step-body">${s.c}</div></div>`).join('')}</div>`;
    if(['neutral','key','warn','analogy','example','beyond','insight','ct','ck','cw','callout'].includes(b.t)){
      const v=b.v||b.t;
      const cls=VARIANTS[v]||'box-neutral';
      const lbl=b.title||(LABELS[v]||'Nota');
      return`<div class="box ${cls}"><div class="box-lbl">${lbl}</div>${b.c}</div>`;
    }
    return'';
  }).join('');
}

/* ═══════════════════════════════════════════════════
   PAGE RENDER
═══════════════════════════════════════════════════ */
function render(){
  const p=pages[cur],m=document.getElementById('main');
  const tl={'content':'Lição','question':'Prática','exam':'Exame'}[p.type];
  const tc={'content':'ec','question':'eq','exam':'ee'}[p.type];
  let h=`<div class="fade">`;
  h+=`<div class="eyebrow"><span class="etype ${tc}">${tl}</span><span>${secMap[cur]}</span></div>`;
  h+=`<h1 class="ptitle">${p.title}</h1>`;
  if(p.sub)h+=`<p class="sub-title">${p.sub}</p>`;
  if(p.type==='content'){h+=rcontent(p);done.add(cur);}
  else if(p.type==='question')h+=rquestion(p);
  else h+=rexam(p);
  h+=`</div>`;
  m.innerHTML=h;
  save();
  buildSideNav();
  updateMobHeader();
}

function rcontent(p){
  let h=rblocks(p.blocks);
  h+=`<div class="navrow">
    <button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button>
    <button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button>
  </div>`;
  return h;
}

function rquestion(p){
  const s=qst;
  let opts=p.options.map((o,i)=>{
    let c='';
    if(s.sub){if(i===p.answer)c='ok';else if(s.sel===i)c='no';}
    else if(s.sel===i)c='sel';
    return`<button class="opt ${c}" onclick="pickopt(${i})" ${s.sub?'disabled':''}>
      <span class="oltr">${String.fromCharCode(65+i)}</span><span>${o}</span>
    </button>`;
  }).join('');
  let fb='',nav='';
  if(s.sub){
    const ok=s.sel===p.answer;done.add(cur);
    fb=`<div class="fb ${ok?'fb-ok':'fb-no'}"><strong>${ok?'Correto.':'Não é bem assim.'}</strong> ${p.expl}</div>`;
    nav=`<div class="navrow"><button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button><button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button></div>`;
  }else{
    nav=`<div class="navrow"><button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button><button class="btn btn-p" onclick="checkq()" ${s.sel===undefined?'disabled':''}>Verificar</button></div>`;
  }
  return`<p class="qtext">${p.question}</p><div class="opts">${opts}</div>${fb}${nav}`;
}

function rexam(p){
  const s=est;
  if(s.sub)return rexamres(p,s);
  let qs=p.questions.map((q,qi)=>{
    let os=q.opts.map((o,oi)=>`<button class="opt ${s[qi]===oi?'sel':''}" onclick="pickexam(${qi},${oi})">
      <span class="oltr">${String.fromCharCode(65+oi)}</span><span>${o}</span>
    </button>`).join('');
    return`<div class="eq-wrap"><div class="eq-num">QUESTÃO ${qi+1} / ${p.questions.length}</div><p class="eq-txt">${q.q}</p><div class="opts">${os}</div></div>`;
  }).join('');
  const ans=Object.keys(s).length;
  return`${qs}<div class="navrow"><button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button><button class="btn btn-p" onclick="submitexam()" ${ans<p.questions.length?'disabled':''}>Submeter (${ans}/${p.questions.length})</button></div>`;
}

function rexamres(p,s){
  const corr=p.questions.filter((q,i)=>s[i]===q.a).length;
  const pct=Math.round(corr/p.questions.length*100);
  const pass=pct>=60;done.add(cur);
  let qs=p.questions.map((q,qi)=>{
    let os=q.opts.map((o,oi)=>{
      let c='';if(oi===q.a)c='ok';else if(s[qi]===oi)c='no';
      return`<button class="opt ${c}" disabled><span class="oltr">${String.fromCharCode(65+oi)}</span><span>${o}</span></button>`;
    }).join('');
    return`<div class="eq-wrap"><div class="eq-num">QUESTÃO ${qi+1}</div><p class="eq-txt">${q.q}</p><div class="opts">${os}</div></div>`;
  }).join('');
  return`<div class="score-box"><div class="score-n ${pass?'score-pass':'score-fail'}">${pct}%</div><div class="score-sub">${corr} / ${p.questions.length} corretas — ${pass?'aprovado ✓':'revê o material e tenta novamente'}</div></div>${qs}<div class="navrow"><button class="btn" onclick="retryexam()">↺ Tentar novamente</button><button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button></div>`;
}

/* ═══════════════════════════════════════════════════
   HANDLERS
═══════════════════════════════════════════════════ */
function pickopt(i){if(qst.sub)return;qst.sel=i;render()}
function checkq(){if(qst.sel===undefined)return;qst.sub=true;render()}
function pickexam(qi,oi){if(est.sub)return;est[qi]=oi;render()}
function submitexam(){const p=pages[cur];if(Object.keys(est).length<p.questions.length)return;est.sub=true;render()}
function retryexam(){est={};render()}

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
load();
render();
</script>
