<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatística & Econometria</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;
  --bg2:#f7f7f5;
  --line:#e8e8e4;
  --line2:#d4d4ce;
  --txt:#111110;
  --txt2:#6b6b66;
  --txt3:#a8a8a2;
  --accent:#111110;
  --blue:#2563eb;
  --green:#16a34a;
  --amber:#d97706;
  --red:#dc2626;
  --r:6px;
}
html{font-size:15px}
body{background:var(--bg);color:var(--txt);font-family:'Geist',system-ui,sans-serif;min-height:100vh}

/* ── LAYOUT ── */
.shell{display:flex;min-height:100vh}

/* ── SIDEBAR ── */
.side{
  width:240px;flex-shrink:0;
  border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;
}
.side-head{padding:20px 16px 14px;border-bottom:1px solid var(--line)}
.side-brand{font-size:11px;font-family:'Geist Mono',monospace;color:var(--txt3);letter-spacing:.06em;margin-bottom:6px}
.side-title{font-size:13px;font-weight:500;color:var(--txt);line-height:1.45}

.prog-wrap{padding:12px 16px;border-bottom:1px solid var(--line)}
.prog-row{display:flex;justify-content:space-between;font-size:11px;font-family:'Geist Mono',monospace;color:var(--txt3);margin-bottom:5px}
.prog-track{height:2px;background:var(--line);border-radius:1px}
.prog-bar{height:100%;border-radius:1px;background:var(--txt);transition:width .4s}

.nav-body{flex:1;padding:6px 0 16px}
.nav-sec{font-size:10px;font-family:'Geist Mono',monospace;letter-spacing:.1em;color:var(--txt3);padding:10px 16px 3px;text-transform:uppercase}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:6px 16px;border:none;background:none;
  font-size:12.5px;color:var(--txt2);cursor:pointer;text-align:left;
  font-family:'Geist',sans-serif;transition:color .1s;
}
.nav-btn:hover{color:var(--txt)}
.nav-btn.on{color:var(--txt);background:var(--bg2)}
.nav-btn.done{color:var(--txt3)}
.ndot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dc{background:#2563eb}.dq{background:#16a34a}.de{background:#d97706}
.nav-btn.on .ndot{background:var(--txt)}
.nav-btn.done .ndot{background:var(--txt3)}
.ntxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── MAIN ── */
.main{flex:1;min-width:0;max-width:680px;padding:48px 56px}

/* ── PAGE ── */
.eyebrow{font-size:11px;font-family:'Geist Mono',monospace;color:var(--txt3);letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.etype{padding:2px 7px;border-radius:3px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.ec{background:#eff6ff;color:#2563eb}
.eq{background:#f0fdf4;color:#16a34a}
.ee{background:#fffbeb;color:#d97706}

.ptitle{font-size:22px;font-weight:500;color:var(--txt);line-height:1.3;margin-bottom:24px;letter-spacing:-.01em}

/* content */
.body-txt{font-size:14.5px;color:var(--txt2);line-height:1.75;margin-bottom:16px;font-weight:300}
.body-txt strong{color:var(--txt);font-weight:500}
.body-txt em{font-style:italic}

.formula{
  border:1px solid var(--line);border-radius:var(--r);
  padding:14px 18px;margin:16px 0;
  font-family:'Geist Mono',monospace;font-size:12.5px;
  color:var(--txt);background:var(--bg2);line-height:1.65;white-space:pre-wrap
}
.formula-lbl{font-size:10px;color:var(--txt3);display:block;margin-bottom:5px;letter-spacing:.06em}

.callout{border-radius:var(--r);padding:12px 16px;margin:16px 0;font-size:13.5px;line-height:1.65;font-weight:300}
.callout-lbl{font-size:10px;font-family:'Geist Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:500}
.ct{border:1px solid var(--line);background:var(--bg2);color:var(--txt2)}.ct .callout-lbl{color:var(--txt3)}
.cw{border:1px solid #fde8e8;background:#fff9f9;color:#7f1d1d}.cw .callout-lbl{color:var(--red)}
.ck{border:1px solid #dbeafe;background:#f0f8ff;color:#1e3a5f}.ck .callout-lbl{color:var(--blue)}

.dtable{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
.dtable tr{border-bottom:1px solid var(--line)}
.dtable tr:last-child{border-bottom:none}
.dtable td{padding:8px 0;vertical-align:top;line-height:1.6}
.dtable td:first-child{font-family:'Geist Mono',monospace;font-size:12px;color:var(--txt);white-space:nowrap;width:170px;padding-right:16px}
.dtable td:last-child{color:var(--txt2);font-weight:300}

/* nav row */
.navrow{display:flex;justify-content:space-between;align-items:center;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.btn{
  padding:7px 16px;border-radius:var(--r);
  border:1px solid var(--line2);background:var(--bg);
  font-size:12.5px;font-family:'Geist',sans-serif;
  color:var(--txt2);cursor:pointer;transition:all .1s;letter-spacing:.01em
}
.btn:hover{border-color:var(--txt3);color:var(--txt)}
.btn:disabled{opacity:.3;cursor:default}
.btn-p{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.btn-p:hover{background:#333;color:var(--bg);border-color:#333}

/* question */
.qtext{font-size:16px;font-weight:400;color:var(--txt);line-height:1.5;margin-bottom:20px;letter-spacing:-.005em}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 14px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg);
  cursor:pointer;font-size:13.5px;color:var(--txt2);
  font-family:'Geist',sans-serif;text-align:left;transition:all .12s;line-height:1.5
}
.opt:hover:not(:disabled){border-color:var(--line2);color:var(--txt)}
.opt.sel{border-color:var(--txt);color:var(--txt);background:var(--bg2)}
.opt.ok{border-color:#16a34a;background:#f0fdf4;color:#14532d}
.opt.no{border-color:#dc2626;background:#fef2f2;color:#7f1d1d}
.oltr{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:'Geist Mono',monospace;flex-shrink:0;margin-top:1px}
.opt.sel .oltr{border-color:var(--txt);color:var(--txt)}
.opt.ok .oltr{border-color:#16a34a;color:#16a34a;background:#dcfce7}
.opt.no .oltr{border-color:#dc2626;color:#dc2626;background:#fee2e2}

.fb{border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;font-weight:300}
.fb strong{font-weight:500}
.fb-ok{border:1px solid #bbf7d0;background:#f0fdf4;color:#14532d}
.fb-no{border:1px solid #fecaca;background:#fef2f2;color:#7f1d1d}

/* exam */
.eq-wrap{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.eq-wrap:last-of-type{border-bottom:none}
.eq-num{font-size:10px;font-family:'Geist Mono',monospace;color:var(--txt3);letter-spacing:.1em;margin-bottom:7px}
.eq-txt{font-size:14.5px;color:var(--txt);line-height:1.5;margin-bottom:12px;font-weight:400}

.score-box{border:1px solid var(--line);border-radius:var(--r);padding:24px;text-align:center;margin-bottom:24px;background:var(--bg2)}
.score-n{font-size:44px;font-weight:300;letter-spacing:-.03em}
.score-pass{color:var(--green)}
.score-fail{color:var(--red)}
.score-sub{font-size:12px;font-family:'Geist Mono',monospace;color:var(--txt3);margin-top:4px}

.fade{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:720px){
  .side{display:none}
  .main{padding:28px 20px}
}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line)}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side-head">
      <div class="side-brand">Estatística & Econometria</div>
      <div class="side-title">Do Zero à Defesa de Tese</div>
    </div>
    <div class="prog-wrap">
      <div class="prog-row"><span>Progresso</span><span id="pct">0%</span></div>
      <div class="prog-track"><div class="prog-bar" id="pbar" style="width:0%"></div></div>
    </div>
    <nav class="nav-body" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const C={sections:[
{id:"s1",title:"Fundamentos",pages:[
{id:"p1a",type:"content",title:"Séries temporais e retornos logarítmicos",blocks:[
{t:"text",c:"Uma <strong>série temporal</strong> é uma sequência de observações ordenadas no tempo. Na tua tese tens dados diários do PSI-20 e do EuroStoxx 50 de 1998 a 2024 — 7.116 observações."},
{t:"table",r:[["Observação","Valor de fecho do PSI-20 num dado dia de bolsa"],["Período","Intervalo entre observações — diário (excluindo fins-de-semana e feriados)"],["Dados de painel","Múltiplas séries para várias entidades — não é o teu caso"]]},
{t:"text",c:"Em vez de trabalhar com preços brutos (não-estacionários), a tua tese usa <strong>retornos logarítmicos</strong>:"},
{t:"formula",l:"Retorno logarítmico diário (em %)",c:"r_t = ln(P_t / P_{t-1}) × 100"},
{t:"text",c:"Porquê logarítmico? Os retornos são aditivos no tempo; aproximadamente simétricos (−10% e +10% comparáveis); e tornam a série estacionária — os preços crescem indefinidamente, os retornos oscilam em torno de zero."},
{t:"callout",v:"ct",title:"Na tua tese",c:"r_t = 1.5 → PSI-20 subiu 1.5% nesse dia. r_t = −2.3 → queda de 2.3%."}
]},
{id:"p1b",type:"question",title:"Retorno logarítmico",
question:"r_t = ln(P_t / P_{t-1}) × 100 dá r_t = −2.1 num determinado dia. O que significa?",
options:["O PSI-20 subiu 2.1% nesse dia","O PSI-20 desceu 2.1% nesse dia","O PSI-20 estava 2.1 pontos abaixo da média","A variância aumentou 2.1%"],
answer:1,expl:"Retorno logarítmico em percentagem. Sinal negativo = queda. r_t = −2.1 significa que o PSI-20 perdeu 2.1% nesse dia de bolsa."},
{id:"p1c",type:"content",title:"Assimetria, curtose e fat tails",blocks:[
{t:"table",r:[["Média (μ)","(1/n) × Σ r_t — para o PSI-20 em 26 anos, próxima de zero"],["Desvio-padrão (σ)","Raiz da média dos desvios ao quadrado — mede a volatilidade histórica média"],["Assimetria < 0","Cauda esquerda mais pesada — quedas extremas mais frequentes (típico nos mercados)"],["Curtose = 3","Distribuição normal (mesocúrtica)"],["Curtose > 3","Leptocúrtica — fat tails; retornos extremos mais frequentes do que a normal preveria"],["Curtose excessiva","Curtose − 3; se positiva confirma fat tails"]]},
{t:"callout",v:"ck",title:"Ligação à tua tese",c:"Os retornos financeiros têm quase sempre curtose > 3 e assimetria negativa. Esta é uma das justificações para usar GARCH em vez de OLS — o OLS assume normalidade dos erros, o que seria incorreto aqui."}
]},
{id:"p1d",type:"question",title:"Curtose",
question:"Os retornos do PSI-20 têm curtose > 3. O que implica metodologicamente?",
options:["Podemos usar OLS normalmente","Os dados têm fat tails — retornos extremos mais frequentes que a normal prevê","A série é não-estacionária","O desvio-padrão está subestimado"],
answer:1,expl:"Curtose > 3 (leptocúrtica) = caudas mais pesadas que a normal. Retornos extremos ocorrem com mais frequência, violando os pressupostos do OLS e justificando GARCH."},
{id:"p1e",type:"content",title:"Testes de hipótese e o valor-p",blocks:[
{t:"table",r:[["H₀ (nula)","A afirmação a testar — 'este coeficiente é zero'"],["H₁ (alternativa)","O que acreditamos se H₀ for falsa — 'coeficiente ≠ 0'"],["Estatística t","Coeficiente estimado ÷ erro-padrão"],["Valor-p","Probabilidade de observar um resultado tão extremo assumindo H₀ verdadeira"],["α = 0.05","Limiar convencional de decisão"]]},
{t:"formula",l:"Estatística t para um coeficiente",c:"t = coeficiente estimado / erro-padrão"},
{t:"callout",v:"cw",title:"Erro comum",c:"O valor-p NÃO é a probabilidade de H₀ ser verdadeira. É a probabilidade de observar estes dados (ou mais extremos) assumindo que H₀ é verdadeira. Esta distinção é crucial numa defesa de tese."},
{t:"table",r:[["p < 0.001 (***)","Evidência muito forte contra H₀"],["p < 0.01 (**)","Evidência forte"],["p < 0.05 (*)","Evidência moderada"],["p < 0.10 (·)","Evidência fraca — marginal"],["p > 0.10","Sem evidência suficiente para rejeitar H₀"]]}
]},
{id:"p1f",type:"question",title:"Valor-p",
question:"O coeficiente het(left_gov) tem p = 0.003. O que podes concluir?",
options:["H₀ é verdadeira com probabilidade 0.3%","Há evidência forte (p < 0.01) para rejeitar H₀ — o efeito é estatisticamente significativo","O coeficiente é igual a 0.003","O resultado é marginalmente significativo"],
answer:1,expl:"p = 0.003 < 0.01 (**). Há evidência forte para rejeitar H₀. Atenção: não é a probabilidade de H₀ ser verdadeira — é a probabilidade de observar este resultado se H₀ fosse verdadeira."},
{id:"p1x",type:"exam",title:"Exame — Fundamentos",questions:[
{q:"O retorno logarítmico é preferível ao simples porque:",opts:["É sempre positivo","É aditivo no tempo e torna a série estacionária","É mais fácil de calcular","Não precisa de logaritmos"],a:1},
{q:"Assimetria negativa nos retornos significa:",opts:["Retornos positivos são mais frequentes","Quedas extremas são mais frequentes que subidas de igual magnitude","A curtose é inferior a 3","A média é maior que a mediana"],a:1},
{q:"O TLC justifica na tua tese que:",opts:["Os retornos são normais","Com n = 7116, os estimadores GARCH têm distribuição aproximadamente normal","A curtose é 3","O OLS é válido"],a:1}
]}
]},

{id:"s2",title:"Séries Temporais",pages:[
{id:"p2a",type:"content",title:"Estacionariedade",blocks:[
{t:"text",c:"Uma série é <strong>estacionária (em sentido fraco)</strong> se as suas propriedades estatísticas não mudam ao longo do tempo: média constante, variância constante, e autocovariância dependendo apenas do lag k."},
{t:"text",c:"Se trabalharmos com séries não-estacionárias como se fossem estacionárias, obtemos <strong>resultados espúrios</strong> — correlações falsas entre variáveis independentes."},
{t:"table",r:[["Preços PSI-20","Não-estacionários — crescem com tendência estocástica (random walk)"],["Retornos log.","Estacionários — oscilam em torno de zero sem tendência"],["I(0)","Estacionária em nível"],["I(1)","Estacionária apenas em primeiras diferenças"]]},
{t:"callout",v:"ct",title:"Na tua tese",c:"ADF aos retornos: Z(t) = −45.15 (p = 0.000). Confirma I(0) — pré-requisito para a validade das inferências sobre os coeficientes GARCH."}
]},
{id:"p2b",type:"question",title:"Estacionariedade",
question:"Uma série I(1) é não-estacionária em nível mas estacionária em primeiras diferenças. Os preços das ações são tipicamente:",
options:["I(0) — estacionários em nível","I(1) — estacionários apenas após diferenciação (como os retornos logarítmicos)","I(2) — precisam de duas diferenciações","Estacionários se a amostra for grande"],
answer:1,expl:"Preços são I(1) — têm tendência estocástica (random walk). Os retornos logarítmicos são a 1ª diferença do log do preço e são I(0), estacionários."},
{id:"p2c",type:"content",title:"Raiz unitária e teste ADF",blocks:[
{t:"formula",l:"Random walk — modelo com raiz unitária",c:"P_t = P_{t-1} + ε_t"},
{t:"text",c:"Os choques acumulam-se indefinidamente — a série 'deriva'. O <strong>teste ADF (Augmented Dickey-Fuller)</strong> testa formalmente a presença de raiz unitária."},
{t:"table",r:[["H₀ do ADF","A série tem raiz unitária — é não-estacionária I(1)"],["H₁ do ADF","Não tem raiz unitária — é estacionária I(0)"],["Z(t) muito negativo","Evidência forte de estacionariedade"],["Valor crítico 5%","−2.86 (rejeita se Z(t) < −2.86)"]]},
{t:"callout",v:"ct",title:"Resultado na tua tese",c:"Z(t) = −45.15 para os retornos PSI-20. Muito mais negativo que −3.43 (crítico a 1%). Rejeição absoluta da hipótese de raiz unitária."}
]},
{id:"p2d",type:"question",title:"Teste ADF",
question:"Z(t) = −45.15 (p = 0.000) para os retornos PSI-20. Conclusão:",
options:["Não rejeitamos H₀ — a série tem raiz unitária","Rejeitamos H₀ — os retornos são estacionários I(0)","A série precisa de ser diferenciada","O GARCH não é necessário"],
answer:1,expl:"Z(t) = −45.15 está muito além do valor crítico de −3.43. Com p = 0.000 rejeitamos H₀ (raiz unitária) com confiança absoluta. Os retornos são I(0)."},
{id:"p2e",type:"content",title:"Autocorrelação e volatility clustering",blocks:[
{t:"formula",l:"Coeficiente de autocorrelação ao lag k",c:"ρ_k = Cov(r_t, r_{t-k}) / Var(r_t)"},
{t:"text",c:"Nos retornos financeiros, a autocorrelação em nível é baixa (consistente com eficiência de mercado). Mas a autocorrelação dos retornos ao <strong>quadrado</strong> é muito elevada — e justifica os modelos GARCH."},
{t:"text",c:"O <strong>volatility clustering</strong>: períodos de alta volatilidade tendem a ser seguidos de mais alta volatilidade, e vice-versa. É um dos factos estilizados mais robustos dos mercados financeiros."},
{t:"callout",v:"ck",title:"Implicação metodológica",c:"Volatility clustering → variância não constante ao longo do tempo → viola homocedasticidade do OLS. Os modelos GARCH foram desenvolvidos para modelar esta variância condicional variável no tempo."}
]},
{id:"p2f",type:"question",title:"Volatility clustering",
question:"O volatility clustering nos retornos financeiros implica que:",
options:["Os retornos são autocorrelacionados em nível","A variância condicional muda ao longo do tempo — viola homocedasticidade do OLS","A média não é constante","Os preços são estacionários"],
answer:1,expl:"Volatility clustering → variância dos retornos não é constante. Viola Var(ε_t) = σ² (homocedasticidade), pressuposto fundamental do OLS. Justifica GARCH."},
{id:"p2x",type:"exam",title:"Exame — Séries Temporais",questions:[
{q:"Condição para estacionariedade fraca:",opts:["Apenas média constante","Média constante, variância constante, autocovariância dependendo só do lag","Distribuição normal dos erros","Ausência de raiz unitária apenas"],a:1},
{q:"Retornos I(0) na tua tese significa:",opts:["Precisam de ser diferenciados","São estacionários em nível — sem diferenciação","Têm raiz unitária","São não-estacionários"],a:1},
{q:"Autocorrelação dos retornos ao quadrado ser elevada indica:",opts:["Os retornos são autocorrelacionados","Existe volatility clustering — justifica GARCH","A série não é estacionária","OLS é adequado"],a:1}
]}
]},

{id:"s3",title:"Regressão e OLS",pages:[
{id:"p3a",type:"content",title:"O modelo OLS e os seus pressupostos",blocks:[
{t:"formula",l:"Equação da média — modelo base da tua tese",c:"r_PSI20,t = α + β₁ · r_ES50,t + β₂ · Var_Política_t + ε_t"},
{t:"table",r:[["α","Constante — retorno esperado quando tudo o resto é zero"],["β₁ ≈ 0.557","Beta de mercado — sensibilidade do PSI-20 ao EuroStoxx 50"],["r_ES50,t","Variável de controlo — retorno do EuroStoxx 50 no mesmo dia"],["ε_t","Resíduo — parte do retorno não explicada pelo modelo"]]},
{t:"text",c:"O <strong>OLS</strong> minimiza a soma dos quadrados dos resíduos. É BLUE (Best Linear Unbiased Estimator) sob os pressupostos de Gauss-Markov:"},
{t:"table",r:[["Linearidade","Relação linear entre X e Y"],["Exogeneidade","X não correlacionado com ε"],["Homocedasticidade","Var(ε_t) = σ² constante ← VIOLADO nos retornos financeiros"],["Sem autocorrelação","Cov(ε_t, ε_s) = 0 para t ≠ s"]]},
{t:"callout",v:"cw",title:"Porque não usas OLS na tua tese",c:"A homocedasticidade é violada nos retornos financeiros. ARCH-LM confirma: χ²(1) = 1668.6, p = 0.000. OLS com heterocedasticidade produz erros-padrão inconsistentes — testes t e valores-p inválidos."}
]},
{id:"p3b",type:"question",title:"Pressuposto violado",
question:"Qual pressuposto do OLS é massivamente violado nos retornos financeiros diários?",
options:["Linearidade","Homocedasticidade — variância constante dos erros","Exogeneidade das variáveis","Normalidade da variável dependente"],
answer:1,expl:"Homocedasticidade (Var(ε_t) = σ² constante) é violada porque a variância dos retornos muda ao longo do tempo — volatility clustering. ARCH-LM com χ²(1) = 1668.6 confirma de forma massiva."},
{id:"p3c",type:"content",title:"Interpretação de coeficientes e dummies",blocks:[
{t:"text",c:"β₁ = 0.557 significa: quando o EuroStoxx 50 sobe 1 p.p., o PSI-20 tende a subir 0.557 p.p. no mesmo dia, <em>ceteris paribus</em>."},
{t:"text",c:"Uma <strong>variável dummy (binária)</strong> assume 0 ou 1. O coeficiente mede a diferença média na variável dependente entre os dois estados."},
{t:"table",r:[["left_gov = 1","Governo de esquerda; 0 se direita"],["snap_only = 1","Nos ±30 dias de eleições antecipadas"],["shock_economic = 1","Janelas do pedido de resgate (2011) e BES (2014)"],["shock_economic = −0.273","Durante choques económicos, retornos 0.273 p.p. mais baixos — ceteris paribus"]]}
]},
{id:"p3d",type:"question",title:"Coeficiente dummy",
question:"shock_economic = −0.273 (p < 0.001) na equação da média significa que:",
options:["O choque económico aumentou os retornos em 0.273 p.p.","Durante janelas de choque económico, os retornos foram em média 0.273 p.p. mais baixos","O modelo explica 27.3% da variância","Há 27.3% de probabilidade de choque"],
answer:1,expl:"Coeficiente de dummy = diferença média entre dummy = 1 e dummy = 0. −0.273 significa retornos 0.273 p.p. mais baixos durante as janelas de choque económico, controlando para o EuroStoxx 50."},
{id:"p3x",type:"exam",title:"Exame — Regressão e OLS",questions:[
{q:"β₁ = 0.557 para o EuroStoxx 50 significa:",opts:["O PSI-20 sobe sempre 0.557% por dia","Quando ES50 sobe 1%, PSI-20 tende a subir 0.557% no mesmo dia","O R² é 0.557","O ES50 explica 55.7% dos retornos"],a:1},
{q:"OLS seria BLUE apenas se:",opts:["Os retornos tivessem curtose > 3","Todos os pressupostos de Gauss-Markov fossem satisfeitos, incluindo homocedasticidade","O ARCH-LM fosse não significativo","A amostra tivesse pelo menos 100 obs."],a:1},
{q:"Ceteris paribus significa:",opts:["Com outros modelos iguais","Mantendo tudo o resto constante","No longo prazo","Com dados anuais"],a:1}
]}
]},

{id:"s4",title:"Heterocedasticidade",pages:[
{id:"p4a",type:"content",title:"ARCH e o teste ARCH-LM",blocks:[
{t:"text",c:"<strong>Heterocedasticidade</strong>: variância dos erros não é constante — Var(ε_t) = σ²_t variável. Viola o OLS. Robert Engle (Nobel 2003) introduziu em 1982 o modelo <strong>ARCH</strong> para captar esta dinâmica."},
{t:"formula",l:"Modelo ARCH(p)",c:"σ²_t = ω + α₁ε²_{t-1} + α₂ε²_{t-2} + ... + αₚε²_{t-p}"},
{t:"text",c:"Se α₁ é grande e significativo, um choque grande ontem gera alta volatilidade hoje — capta o volatility clustering."},
{t:"text",c:"O <strong>teste ARCH-LM</strong> testa formalmente a presença de efeitos ARCH nos resíduos:"},
{t:"table",r:[["H₀","Sem efeitos ARCH — homocedasticidade (OLS válido)"],["H₁","Há efeitos ARCH — heterocedasticidade condicional (GARCH necessário)"],["Estatística","χ²(q) com q graus de liberdade"],["Na tua tese","χ²(1) = 1668.6, p = 0.000 — rejeição massiva de H₀"]]},
{t:"callout",v:"cw",title:"Resultado na tua tese",c:"χ²(1) = 1668.6 é extraordinariamente elevado. O valor crítico a 5% é apenas 3.84 — estamos 434× acima. GARCH não é apenas recomendável: é obrigatório."}
]},
{id:"p4b",type:"question",title:"ARCH-LM",
question:"χ²(1) = 1668.6 (p = 0.000) no teste ARCH-LM. Conclusão:",
options:["Não rejeitamos H₀ — OLS é válido","Rejeitamos H₀ com força extrema — heterocedasticidade condicional intensa; GARCH obrigatório","Os retornos têm autocorrelação de ordem 1","A série não é estacionária"],
answer:1,expl:"χ²(1) = 1668.6 está 434× acima do valor crítico de 3.84. Com p = 0.000, rejeição absoluta de H₀ (homocedasticidade). Efeitos ARCH extremamente fortes — GARCH obrigatório."},
{id:"p4x",type:"exam",title:"Exame — Heterocedasticidade",questions:[
{q:"O modelo ARCH(1) especifica σ²_t como:",opts:["σ²_t = ω + α₁ · r_{t-1}","σ²_t = ω + α₁ · ε²_{t-1}","σ²_t = ω + β₁ · σ²_{t-1}","σ²_t = ω + α₁ · ε_{t-1}"],a:1},
{q:"H₁ do ARCH-LM é:",opts:["A série tem raiz unitária","Os retornos são normais","Há efeitos ARCH — heterocedasticidade condicional","O modelo está bem especificado"],a:2},
{q:"Sem homocedasticidade, o OLS produz:",opts:["Coeficientes enviesados","Erros-padrão inconsistentes — testes t e valores-p inválidos","Retornos não-estacionários","R² nulo"],a:1}
]}
]},

{id:"s5",title:"Modelos GARCH",pages:[
{id:"p5a",type:"content",title:"GARCH(1,1) — parâmetros e interpretação",blocks:[
{t:"text",c:"Bollerslev (1986) generalizou o ARCH adicionando lags da própria variância condicional. O <strong>GARCH(1,1)</strong> tornou-se o padrão pela parcimónia e excelente ajustamento empírico."},
{t:"formula",l:"GARCH(1,1) — equação da variância condicional",c:"σ²_t = ω + α · ε²_{t-1} + β · σ²_{t-1}"},
{t:"table",r:[["ω (omega)","Componente constante da variância — nível base. Deve ser ω > 0."],["α (alfa)","Reação imediata a novos choques — efeito de ε²_{t-1}. 0 < α < 1."],["β (beta)","Persistência — quanto do nível de volatilidade de ontem se mantém. 0 < β < 1."],["α + β","Persistência total. Se = 1: IGARCH (persistência infinita). Na tua tese: 0.931–0.968."]]},
{t:"callout",v:"ct",title:"Condição de estacionariedade",c:"α + β < 1 (e ω > 0, α ≥ 0, β ≥ 0). Todos os teus modelos satisfazem esta condição."},
{t:"formula",l:"Semi-vida de um choque (com β = 0.948)",c:"Semi-vida = ln(0.5) / ln(β) = ln(0.5) / ln(0.948) ≈ 13 dias de bolsa"}
]},
{id:"p5b",type:"question",title:"Persistência GARCH",
question:"Nos teus modelos GARCH, α + β ≈ 0.968. O que significa?",
options:["A volatilidade é explosiva e cresce indefinidamente","Volatilidade muito persistente — 96.8% de um choque persiste no dia seguinte; α + β < 1 garante estacionariedade","Os choques de volatilidade dissipam-se instantaneamente","O modelo está mal especificado"],
answer:1,expl:"α + β = 0.968 indica alta persistência. Como α + β < 1, o processo é covariância-estacionário — a volatilidade reverterá à média incondicional no longo prazo."},
{id:"p5c",type:"content",title:"MLE, AIC e BIC",blocks:[
{t:"text",c:"Os modelos GARCH são estimados por <strong>Máxima Verossimilhança (MLE)</strong>: encontrar os parâmetros que maximizam a probabilidade de observar os dados que realmente observámos."},
{t:"formula",l:"Log-verossimilhança do GARCH (normalidade)",c:"L(θ) = Σ_t [ −½ ln(σ²_t) − ½ ε²_t/σ²_t ]"},
{t:"text",c:"O <strong>AIC e BIC</strong> comparam modelos penalizando a complexidade (parâmetros adicionais):"},
{t:"formula",l:"Critérios de informação",c:"AIC = −2 × log-lik + 2k\nBIC = −2 × log-lik + k × ln(n)"},
{t:"callout",v:"ct",title:"Na tua tese",c:"M6 (EGARCH com variáveis eleitorais) tem menor AIC (17427.3) e BIC (17482.3) — melhor ajustamento. O BIC penaliza mais parâmetros adicionais que o AIC (ln(7116) >> 2)."}
]},
{id:"p5d",type:"question",title:"AIC e BIC",
question:"M5: AIC = 17430.1. M6: AIC = 17427.3. Qual é o modelo preferido?",
options:["M5, porque tem AIC maior","M6, porque tem menor AIC — melhor ajustamento penalizado","São equivalentes","M5, porque tem menos parâmetros"],
answer:1,expl:"Menor AIC = melhor modelo. M6 com AIC = 17427.3 é preferido. O AIC penaliza parâmetros adicionais para evitar overfitting."},
{id:"p5x",type:"exam",title:"Exame — Modelos GARCH",questions:[
{q:"No GARCH(1,1), β · σ²_{t-1} representa:",opts:["O efeito do choque de ontem","A componente constante da variância","A memória — quanto do nível de volatilidade de ontem persiste","O nível incondicional de longo prazo"],a:2},
{q:"A condição α + β < 1 garante:",opts:["Que α e β são positivos","Que o processo é covariância-estacionário — variância não explode","Que os choques são simétricos","Que capta o leverage effect"],a:1},
{q:"Porque usamos MLE e não OLS para estimar GARCH?",opts:["OLS é equivalente","GARCH modela variância condicional variável — MLE maximiza a verossimilhança do modelo heterocedástico","MLE é mais fácil de computar","OLS não existe para dados financeiros"],a:1}
]}
]},

{id:"s6",title:"EGARCH",pages:[
{id:"p6a",type:"content",title:"Leverage effect — a limitação do GARCH simétrico",blocks:[
{t:"text",c:"O GARCH(1,1) trata choques positivos e negativos da <strong>mesma forma</strong>: +3% e −3% produzem ε² = 9%, com efeito idêntico na volatilidade."},
{t:"text",c:"Empiricamente, <strong>más notícias geram sistematicamente mais volatilidade</strong> que boas notícias de igual magnitude. Este padrão — o <strong>leverage effect</strong> — foi identificado por Fischer Black (1976)."},
{t:"table",r:[["Mecanismo 1","Quando ações caem, rácio dívida/capital sobe → maior risco financeiro → maior variância exigida"],["Mecanismo 2","Quando volatilidade esperada aumenta, investidores exigem maior retorno → preço cai"],["Evidência","O 2º mecanismo tem maior importância empírica"]]},
{t:"callout",v:"ct",title:"Na tua tese",c:"γ = −0.078 (M5) e γ = −0.083 (M6), ambos p < 0.001. Confirmação robusta do leverage effect no PSI-20. Alinhado com Caiado (2004) e Bentes (2018)."}
]},
{id:"p6b",type:"question",title:"Leverage effect",
question:"No EGARCH, γ = −0.078 (p < 0.001). O que significa γ < 0?",
options:["Choques positivos geram mais volatilidade","Choques negativos (más notícias) geram mais volatilidade que positivos de igual magnitude","A volatilidade é negativa em alguns períodos","O modelo não captura assimetria"],
answer:1,expl:"γ < 0 no EGARCH significa que quando o retorno foi negativo (z < 0), o efeito na volatilidade é maior do que quando foi positivo de igual magnitude — leverage effect."},
{id:"p6c",type:"content",title:"O modelo EGARCH de Nelson (1991)",blocks:[
{t:"formula",l:"EGARCH(1,1)",c:"ln(σ²_t) = ω + β·ln(σ²_{t-1}) + α·[|z_{t-1}| − E|z_{t-1}|] + γ·z_{t-1}"},
{t:"text",c:"onde z_t = ε_t / σ_t são os resíduos padronizados."},
{t:"table",r:[["β (persistência)","Análoga ao β do GARCH. Na tua tese: 0.948 (M5) e 0.946 (M6)"],["α (magnitude)","Resposta simétrica à magnitude dos choques. M5: 0.338"],["γ (assimetria)","Parâmetro do leverage effect. γ < 0 → más notícias geram mais volatilidade"],["ln(σ²_t)","Trabalhar em logs garante variância sempre positiva — α e β podem ser negativos"]]},
{t:"callout",v:"ck",title:"Cálculo concreto (M5): α = 0.338, γ = −0.078",c:"Choque positivo: efeito = α + γ = 0.338 − 0.078 = 0.260\nChoque negativo: efeito = α − γ = 0.338 + 0.078 = 0.416\nMás notícias geram ~60% mais volatilidade que boas notícias equivalentes."}
]},
{id:"p6d",type:"question",title:"Cálculo EGARCH",
question:"Com α = 0.338 e γ = −0.078, qual o efeito comparado de má notícia vs. boa notícia?",
options:["Igual — EGARCH trata ambos da mesma forma","Má notícia: 0.416 vs. boa notícia: 0.260 — más notícias geram ~60% mais volatilidade","Boa notícia tem mais impacto porque γ é negativo","Indeterminado com estes parâmetros"],
answer:1,expl:"Positivo: α + γ = 0.338 + (−0.078) = 0.260. Negativo: α − γ = 0.338 − (−0.078) = 0.416. Razão: 0.416 / 0.260 ≈ 1.60 → 60% mais volatilidade com más notícias."},
{id:"p6x",type:"exam",title:"Exame — EGARCH",questions:[
{q:"Principal vantagem do EGARCH face ao GARCH(1,1):",opts:["Tem menos parâmetros","Capta assimetria — leverage effect — entre choques positivos e negativos","Não requer distribuição normal","Tem convergência mais rápida"],a:1},
{q:"Trabalhar com ln(σ²_t) no EGARCH oferece:",opts:["Torna o modelo mais linear","Variância estimada sempre positiva, mesmo com parâmetros negativos","Reduz a persistência","Elimina ω"],a:1},
{q:"γ = −0.083 (p < 0.001) confirma:",opts:["Volatilidade constante","Leverage effect — más notícias amplificam mais a volatilidade","Que GARCH simétrico é preferível","Ausência de persistência"],a:1}
]}
]},

{id:"s7",title:"Variáveis Políticas",pages:[
{id:"p7a",type:"content",title:"Média vs. variância — onde colocar as variáveis políticas",blocks:[
{t:"text",c:"As variáveis políticas podem entrar na <strong>equação da média</strong> (testam efeito nos retornos médios) ou na <strong>equação da variância</strong> (testam efeito na volatilidade)."},
{t:"table",r:[["Equação da média","Testa se eventos políticos afetam os retornos médios"],["Resultado geral","Quase nenhuma variável é significativa — consistente com eficiência semi-forte"],["Excepção","shock_economic = −0.273*** — choques económicos afetam os retornos médios"],["Equação da variância","Testa se eventos políticos afetam a volatilidade"]]},
{t:"formula",l:"Especificação het() — efeito percentual na variância incondicional",c:"σ²_t = σ̄² × exp(δ × Var_Política_t) × [dinâmica GARCH]"},
{t:"table",r:[["het(left_gov) = −0.077","Governos de esquerda reduzem a variância em 7.7% face à direita"],["Sinal negativo","Menor volatilidade sob governos de esquerda"],["Especificação multiplicativa","Garante que a variância permanece sempre positiva"]]}
]},
{id:"p7b",type:"question",title:"het()",
question:"het(left_gov) = −0.077 (p < 0.001). Como interpretas?",
options:["Retornos médios são 7.7% mais baixos sob esquerda","A variância condicional é 7.7% mais baixa (menor volatilidade) sob governos de esquerda","O leverage effect é mais forte sob esquerda","A série não é estacionária sob esquerda"],
answer:1,expl:"Na especificação het(), o coeficiente δ actua como efeito percentual multiplicativo sobre a variância incondicional. δ = −0.077 → variância 7.7% mais baixa sob governos de esquerda vs. direita."},
{id:"p7c",type:"content",title:"Janelas de eventos e dummies mutuamente exclusivas",blocks:[
{t:"table",r:[["±30 dias antes","Capta antecipação do mercado — incerteza eleitoral crescente"],["Dia do evento","O próprio evento"],["±30 dias depois","Resolução da incerteza e formação do novo governo"],["Total","61 dias de bolsa por evento"],["Fundamento","Białkowski et al. (2008) usam janelas semelhantes"]]},
{t:"text",c:"<strong>regular_only e snap_only</strong> são mutuamente exclusivas — um dia não pode pertencer a ambas. Se snap fosse subconjunto de election, haveria <strong>multicolinearidade</strong>: coeficientes instáveis e erros-padrão muito elevados."},
{t:"callout",v:"ck",title:"Poder estatístico — limitação importante",c:"±30 dias × 9 eleições ≈ 540 dias de 'tratamento' em 7.116 total (~7.6%). Para efeitos pequenos, esta proporção pode ser insuficiente para atingir significância — o que pode explicar ausência de efeitos nas variáveis eleitorais individuais."}
]},
{id:"p7x",type:"exam",title:"Exame — Variáveis Políticas",questions:[
{q:"Porque regular_only e snap_only são mutuamente exclusivas?",opts:["Para aumentar o poder estatístico","Para evitar multicolinearidade — coeficientes instáveis e erros-padrão elevados","Para reduzir o número de observações","Para garantir α + β < 1"],a:1},
{q:"Ausência de efeitos significativos na média em torno de eleições é consistente com:",opts:["Hipótese de volatilidade eficiente","Eficiência semi-forte — eleições são eventos públicos antecipados","O leverage effect","Raiz unitária nos retornos"],a:1},
{q:"het() é preferível a incluir variáveis políticas na equação da média porque:",opts:["É computacionalmente mais simples","Permite testar se eventos afetam a volatilidade — não apenas os retornos médios","Elimina necessidade de GARCH","Aumenta o R²"],a:1}
]}
]},

{id:"s8",title:"Eficiência de Mercado",pages:[
{id:"p8a",type:"content",title:"A Hipótese dos Mercados Eficientes",blocks:[
{t:"text",c:"Fama (1970, 1991) propôs que os mercados são eficientes: os preços refletem toda a informação disponível. Três formas:"},
{t:"table",r:[["Forma fraca","Preços refletem toda a informação histórica de preços. Análise técnica não gera alfa."],["Forma semi-forte","Preços refletem toda a informação PÚBLICA — anúncios, mudanças de governo, eventos macro."],["Forma forte","Toda a informação, incluindo privada (insider). Geralmente rejeitada empiricamente."]]},
{t:"text",c:"A ausência de efeitos nos retornos médios em torno de eleições é consistente com a <strong>eficiência semi-forte</strong>. As eleições são eventos públicos antecipados — a incerteza é incorporada gradualmente."},
{t:"callout",v:"ck",title:"Nuance crucial para a defesa",c:"Eficiência semi-forte refere-se à MÉDIA dos retornos — não à VOLATILIDADE. A tua tese encontra retornos médios eficientes mas volatilidade com padrões previsíveis (left_gov na variância). Eficiência de retornos ≠ eficiência de volatilidade."}
]},
{id:"p8b",type:"question",title:"EMH e a tua tese",
question:"A tua tese encontra efeito de left_gov na variância mas não nos retornos médios. Isto:",
options:["Contradiz a EMH — os mercados não são eficientes","É consistente com a EMH semi-forte — retornos médios eficientes mas volatilidade pode ter padrões previsíveis","Confirma que a EMH não se aplica a Portugal","Invalida os modelos GARCH usados"],
answer:1,expl:"EMH semi-forte diz que retornos médios não são previsíveis com informação pública — não diz nada sobre a volatilidade. Volatilidade previsível não contradiz a EMH. São dimensões independentes."},
{id:"p8x",type:"exam",title:"Exame — Eficiência de Mercado",questions:[
{q:"Pástor & Veronesi (2020) explicam o Presidential Puzzle por:",opts:["Políticas de esquerda mais favoráveis às empresas","Governos de esquerda são eleitos em momentos de alta aversão ao risco — maior prémio de risco — efeito de composição temporal","A EMH é violada sob governos de esquerda","Menor défice fiscal sob esquerda"],a:1},
{q:"Forma semi-forte da EMH: preços refletem:",opts:["Apenas preços históricos","Toda a informação pública disponível","Toda a informação incluindo insider","Apenas anúncios de resultados"],a:1},
{q:"Se os mercados forem semi-fortemente eficientes, comprar 30 dias antes das eleições deveria:",opts:["Gerar retornos anormais consistentes","Não gerar retornos anormais — a incerteza já está incorporada","Gerar perdas sistemáticas","Funcionar apenas em mercados pequenos"],a:1}
]}
]},

{id:"s9",title:"Diagnósticos",pages:[
{id:"p9a",type:"content",title:"Diagnósticos, OPG e robustez",blocks:[
{t:"text",c:"Após estimar o GARCH, analisamos os <strong>resíduos padronizados</strong> z_t = ε_t / σ_t. Se o modelo estiver bem especificado: aproximadamente independentes, variância ≈ 1, sem efeitos ARCH residuais."},
{t:"table",r:[["Teste Ljung-Box","H₀: sem autocorrelação até lag k. Se p > 0.05, resíduos aproximadamente não autocorrelacionados."],["Convergência","Todos os seis modelos convergem sem erros — confirma máximo global encontrado."],["OPG","Outer Product of Gradients — erros-padrão mais robustos a má-especificação que o Hessiano simples. Usado na tua tese."]]},
{t:"callout",v:"ct",title:"Robustez dos resultados",c:"γ ≈ −0.08 confirmado em ambos M5 e M6 (especificações distintas). Coeficiente do EuroStoxx 50 extremamente estável em todos os modelos (≈ 0.557). Convergência limpa em todos os modelos."}
]},
{id:"p9b",type:"question",title:"Erros-padrão OPG",
question:"Porque é que o OPG é preferível ao Hessiano simples nos modelos GARCH?",
options:["OPG dá sempre erros-padrão mais pequenos","OPG é mais robusto a má-especificação — usa gradientes individuais de cada observação em vez de apenas a curvatura global","OPG assume normalidade dos erros","OPG é mais fácil de computar"],
answer:1,expl:"OPG usa gradientes individuais de cada observação, tornando-o mais robusto quando há incerteza sobre a correta especificação da distribuição dos erros. Mais conservador que o Hessiano — erros-padrão tendem a ser maiores, inferências mais prudentes."}
]},

{id:"s10",title:"Ciclos Políticos",pages:[
{id:"p10a",type:"content",title:"Teorias de ciclos políticos",blocks:[
{t:"table",r:[["Nordhaus (1975)","Ciclo oportunista: governantes estimulam a economia antes das eleições e pagam o custo depois. Eleitores com memória curta."],["Hibbs (1977)","Teoria partidária: esquerda prefere menor desemprego (aceita mais inflação); direita prefere menor inflação."],["Alesina (1987)","Com expectativas racionais: apenas a SURPRESA eleitoral gera efeitos reais transitórios."],["Pástor & Veronesi (2020)","Governos de esquerda eleitos em momentos de alta aversão ao risco → maior prémio de risco. Efeito de composição temporal, não causal."]]},
{t:"callout",v:"ct",title:"Ligação ao teu resultado",c:"het(left_gov) = −0.077 pode refletir composição temporal: governos PS em Portugal em crescimento (1995–2002, 2015–2023); PSD/CDS na crise (2002–2005, 2011–2015). O modelo controla para risco europeu via EuroStoxx 50, mas não elimina completamente esta confundição."}
]},
{id:"p10b",type:"question",title:"Ciclos políticos",
question:"Segundo Alesina (1987) com expectativas racionais, o motor dos efeitos de mercado em torno de eleições é:",
options:["O resultado eleitoral em si","A surpresa eleitoral — resultado diferente do esperado gera efeitos reais transitórios","As políticas dos primeiros 100 dias","A volatilidade pré-eleitoral acumulada"],
answer:1,expl:"Com expectativas racionais, o resultado mais provável já está 'no preço'. Apenas a SURPRESA — resultado inesperado — gera efeitos reais transitórios. Se o resultado era amplamente antecipado, não há efeito."}
]},

{id:"s11",title:"Conceitos Avançados",pages:[
{id:"p11a",type:"content",title:"Endogeneidade e potência estatística",blocks:[
{t:"text",c:"A <strong>endogeneidade</strong> ocorre quando uma variável explicativa está correlacionada com os erros — viola a exogeneidade do OLS."},
{t:"callout",v:"cw",title:"Exemplo na tua tese",c:"Governos com fraco desempenho económico têm maior probabilidade de colapsar antecipadamente. Isto cria correlação entre a variável política e o estado anterior dos mercados — potencial endogeneidade das variáveis políticas."},
{t:"text",c:"A endogeneidade parcial <strong>não invalida os resultados</strong> — limita apenas a interpretação causal. Os resultados descrevem associações robustas. A tese reconhece esta limitação e sugere extensões com variáveis instrumentais."},
{t:"text",c:"A <strong>potência de um teste</strong> é a probabilidade de rejeitar H₀ quando H₀ é falsa. Com apenas ~7.6% da amostra nos 'dias eleitorais', efeitos pequenos podem não atingir significância — o que pode explicar ausência de efeitos nas variáveis eleitorais individuais."}
]},
{id:"p11b",type:"question",title:"Endogeneidade",
question:"A possível endogeneidade das variáveis políticas na tua tese implica que:",
options:["Os resultados estão completamente invalidados","Os resultados descrevem associações robustas mas a interpretação estritamente causal é limitada — a tese reconhece isto como limitação","O GARCH resolve o problema","A endogeneidade não existe em modelos GARCH"],
answer:1,expl:"Endogeneidade parcial não invalida os resultados — limita a interpretação causal. Reconhecer limitações metodológicas com rigor é uma virtude numa tese, não uma fraqueza."}
]},

/* ── STATE ── */
let pages=[],secMap=[];
C.sections.forEach(s=>s.pages.forEach(p=>{secMap.push(s.title);pages.push({...p})}));
let cur=0,done=new Set(),qst={},est={};

function goto(i){if(i<0||i>=pages.length)return;cur=i;qst={};est={};render();window.scrollTo(0,0)}

/* ── SIDEBAR ── */
function buildNav(){
  let html='',last='';
  pages.forEach((p,i)=>{
    const s=secMap[i];
    if(s!==last){html+=`<div class="nav-sec">${s}</div>`;last=s}
    const dc={'content':'dc','question':'dq','exam':'de'}[p.type];
    const on=i===cur,dn=done.has(i)&&!on;
    html+=`<button class="nav-btn${on?' on':''}${dn?' done':''}" onclick="goto(${i})">
      <span class="ndot ${dc}"></span>
      <span class="ntxt">${p.title}</span>
    </button>`;
  });
  document.getElementById('nav').innerHTML=html;
  const pct=Math.round(done.size/pages.length*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pbar').style.width=pct+'%';
}

/* ── RENDER BLOCKS ── */
function rblocks(bs){
  return bs.map(b=>{
    if(b.t==='text')return`<p class="body-txt">${b.c}</p>`;
    if(b.t==='formula')return`<div class="formula"><span class="formula-lbl">${b.l}</span>${b.c}</div>`;
    if(b.t==='callout')return`<div class="callout ${b.v}"><div class="callout-lbl">${b.title}</div>${b.c}</div>`;
    if(b.t==='table')return`<table class="dtable">${b.r.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    return'';
  }).join('');
}

/* ── PAGE ── */
function render(){
  const p=pages[cur],m=document.getElementById('main');
  const tl={'content':'Lição','question':'Prática','exam':'Exame'}[p.type];
  const tc={'content':'ec','question':'eq','exam':'ee'}[p.type];
  let h=`<div class="fade">`;
  h+=`<div class="eyebrow"><span class="etype ${tc}">${tl}</span><span>${secMap[cur]}</span></div>`;
  h+=`<h1 class="ptitle">${p.title}</h1>`;
  if(p.type==='content'){h+=rcontent(p);}
  else if(p.type==='question'){h+=rquestion(p);}
  else{h+=rexam(p);}
  h+=`</div>`;
  m.innerHTML=h;
  if(p.type==='content')done.add(cur);
  buildNav();
}

function rcontent(p){
  let h=rblocks(p.blocks);
  h+=`<div class="navrow">
    <button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button>
    <button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button>
  </div>`;
  return h;
}

function rquestion(p){
  const s=qst;
  let opts=p.options.map((o,i)=>{
    let c='';
    if(s.submitted){if(i===p.answer)c='ok';else if(s.sel===i)c='no';}
    else if(s.sel===i)c='sel';
    return`<button class="opt ${c}" onclick="pickopt(${i})" ${s.submitted?'disabled':''}>
      <span class="oltr">${String.fromCharCode(65+i)}</span><span>${o}</span>
    </button>`;
  }).join('');
  let fb='',nav='';
  if(s.submitted){
    const ok=s.sel===p.answer;
    done.add(cur);
    fb=`<div class="fb ${ok?'fb-ok':'fb-no'}"><strong>${ok?'Correto.':'Não é bem assim.'}</strong> ${p.expl}</div>`;
    nav=`<div class="navrow">
      <button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button>
      <button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button>
    </div>`;
  }else{
    nav=`<div class="navrow">
      <button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button>
      <button class="btn btn-p" onclick="checkq()" ${s.sel===undefined?'disabled':''}>Verificar</button>
    </div>`;
  }
  return`<p class="qtext">${p.question}</p><div class="opts">${opts}</div>${fb}${nav}`;
}

function rexam(p){
  const s=est;
  if(s.submitted)return rexamresult(p,s);
  let qs=p.questions.map((q,qi)=>{
    let os=q.opts.map((o,oi)=>`<button class="opt ${s[qi]===oi?'sel':''}" onclick="pickexam(${qi},${oi})">
      <span class="oltr">${String.fromCharCode(65+oi)}</span><span>${o}</span>
    </button>`).join('');
    return`<div class="eq-wrap">
      <div class="eq-num">QUESTÃO ${qi+1} / ${p.questions.length}</div>
      <p class="eq-txt">${q.q}</p>
      <div class="opts">${os}</div>
    </div>`;
  }).join('');
  const ans=Object.keys(s).length;
  return`${qs}<div class="navrow">
    <button class="btn" onclick="goto(${cur-1})" ${cur===0?'disabled':''}>← Anterior</button>
    <button class="btn btn-p" onclick="submitexam()" ${ans<p.questions.length?'disabled':''}>Submeter (${ans}/${p.questions.length})</button>
  </div>`;
}

function rexamresult(p,s){
  const correct=p.questions.filter((q,i)=>s[i]===q.a).length;
  const pct=Math.round(correct/p.questions.length*100);
  const pass=pct>=60;
  done.add(cur);
  let qs=p.questions.map((q,qi)=>{
    let os=q.opts.map((o,oi)=>{
      let c='';
      if(oi===q.a)c='ok';
      else if(s[qi]===oi)c='no';
      return`<button class="opt ${c}" disabled>
        <span class="oltr">${String.fromCharCode(65+oi)}</span><span>${o}</span>
      </button>`;
    }).join('');
    return`<div class="eq-wrap"><div class="eq-num">QUESTÃO ${qi+1}</div><p class="eq-txt">${q.q}</p><div class="opts">${os}</div></div>`;
  }).join('');
  return`<div class="score-box">
    <div class="score-n ${pass?'score-pass':'score-fail'}">${pct}%</div>
    <div class="score-sub">${correct} / ${p.questions.length} corretas — ${pass?'aprovado':'estuda mais e tenta novamente'}</div>
  </div>${qs}
  <div class="navrow">
    <button class="btn" onclick="retryexam()">↺ Tentar novamente</button>
    <button class="btn btn-p" onclick="goto(${cur+1})" ${cur===pages.length-1?'disabled':''}>Seguinte →</button>
  </div>`;
}

function pickopt(i){if(qst.submitted)return;qst.sel=i;render()}
function checkq(){if(qst.sel===undefined)return;qst.submitted=true;render()}
function pickexam(qi,oi){if(est.submitted)return;est[qi]=oi;render()}
function submitexam(){const p=pages[cur];if(Object.keys(est).length<p.questions.length)return;est.submitted=true;render()}
function retryexam(){est={};render()}

render();
</script>
